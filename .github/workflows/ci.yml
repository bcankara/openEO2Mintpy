name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v5

      # GDAL's Python bindings have no PyPI wheels; without them the alignment,
      # geometry and band-split tests are skipped, so take GDAL from conda-forge.
      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python-version }}
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Install dependencies
        run: |
          conda install -y gdal numpy h5py
          pip install -e ".[dev]"

      - name: Check GDAL
        run: python -c "from osgeo import gdal; print('GDAL', gdal.__version__)"

      - name: Run tests
        run: pytest tests/ -v --tb=short -rs

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
