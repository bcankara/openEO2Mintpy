##------ openeo2mintpy auto-generated configuration for MintPy ------##
## Generated by openeo2mintpy v1.0.0
## Run with: smallbaselineApp.py mintpy_config.txt

mintpy.project.name        = openEO2Mintpy_project

########## Load Data ##########
## Metadata and perpendicular baselines are read from the .rsc sidecars
## written by openeo2mintpy, so metaFile / baselineDir stay on 'auto'.
mintpy.load.processor      = isce
mintpy.load.autoPath       = no
mintpy.load.metaFile       = auto
mintpy.load.baselineDir    = auto

## Interferograms (openEO/ClouDInSAR outputs after split and align)
mintpy.load.unwFile        = ./asc/unw/*.unw.tif
mintpy.load.corFile        = ./asc/cor/*.cor.tif
mintpy.load.connCompFile   = ./asc/unw/*.unw.conncomp.tif

## Geometry on the stack grid (DEM + orbit-derived angle rasters)
mintpy.load.demFile        = ./asc/geometry/dem.tif
mintpy.load.incAngleFile   = ./asc/geometry/incidenceAngle.tif
mintpy.load.azAngleFile    = ./asc/geometry/azimuthAngle.tif

## Lookup tables: only needed for stacks in radar geometry.
mintpy.load.lookupYFile    = auto
mintpy.load.lookupXFile    = auto

## Water mask (optional)
mintpy.load.waterMaskFile  = auto

########## Reference Point ##########
mintpy.reference.yx        = auto
mintpy.reference.lalo      = auto

########## Network Inversion ##########
mintpy.networkInversion.weightFunc   = coherence
mintpy.networkInversion.maskDataset  = connectComponent
mintpy.networkInversion.minTempCoh   = 0.4

########## Tropospheric Delay Correction ##########
## Options: no / pyaps / height_correlation / gacos
## CENTER_LINE_UTC is written, so 'pyaps' (ERA5, needs a CDS API key) can be used.
mintpy.troposphericDelay.method = no

########## Topographic Residual (DEM Error) ##########
mintpy.topographicResidual = yes

########## Velocity Estimation ##########
mintpy.deramp              = no

########## Output ##########
mintpy.save.hdfEos5        = no
mintpy.save.kmz            = yes
